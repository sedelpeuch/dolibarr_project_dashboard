[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolibarr-dashboard"
version = "0.1.0"
description = "Dashboard for Dolibarr project coordination"
requires-python = ">=3.11"
authors = [
    {name = "Coordinator", email = "coordinator@example.com"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]